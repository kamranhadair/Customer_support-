name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check app/ tests/ dashboard/ seed_data.py --output-format=github

      - name: Run tests
        env:
          GROQ_API_KEY: "test_key_ci"
          SQLITE_DB_PATH: "/tmp/test_support.db"
          CHROMA_RAG_PATH: "/tmp/test_chroma_rag"
          CHROMA_MEM0_PATH: "/tmp/test_chroma_mem0"
          KB_DOCS_PATH: "./knowledge_base/docs"
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: support-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
